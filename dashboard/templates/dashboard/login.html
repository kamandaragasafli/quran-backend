{% load static %}
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giriş · Miras Dashboard</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #171d25;
      --border: rgba(255,255,255,.08);
      --text: #e8eef5;
      --muted: #8b9aab;
      --teal: #2bbbad;
      --danger: #e57373;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 20% 0%, rgba(43,187,173,.16), transparent 55%),
        radial-gradient(700px 400px at 90% 100%, rgba(43,187,173,.08), transparent 50%),
        var(--bg);
      color: var(--text);
    }
    .card {
      width: min(100%, 400px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 26px 24px;
      box-shadow: 0 20px 48px rgba(0,0,0,.35);
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 22px;
    }
    .brand-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: cover;
      display: block;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.08),
        0 12px 28px rgba(0,0,0,.45);
    }
    .brand strong { display: block; font-size: 18px; letter-spacing: -0.02em; }
    .brand span { font-size: 12px; color: var(--muted); font-weight: 600; }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: -0.02em;
    }
    .sub {
      margin: 0 0 20px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin: 0 0 6px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: rgba(0,0,0,.25);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      margin-bottom: 14px;
    }
    input:focus {
      outline: none;
      border-color: rgba(43,187,173,.55);
      box-shadow: 0 0 0 3px rgba(43,187,173,.14);
    }
    .err {
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(229,57,53,.1);
      border: 1px solid rgba(229,57,53,.25);
      color: var(--danger);
      font-size: 13px;
      font-weight: 600;
    }
    button {
      width: 100%;
      margin-top: 4px;
      appearance: none;
      border: none;
      cursor: pointer;
      padding: 13px 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      background: linear-gradient(135deg, #7ed6c2, #2bbbad);
      box-shadow: 0 4px 14px rgba(43,187,173,.3);
    }
    button:hover { filter: brightness(1.04); }
  </style>
</head>
<body>
  <form class="card" method="post" action="{% url 'dash-login' %}">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}
    <div class="brand">
      <img
        class="brand-logo"
        src="{% static 'dashboard/app-logo.png' %}"
        alt="Miras"
        width="88"
        height="88"
      />
      <div>
        <strong>Miras</strong>
        <span>Dashboard</span>
      </div>
    </div>
    <h1>Giriş</h1>
    <p class="sub">Davam etmək üçün istifadəçi adı və şifrə daxil edin.</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <label for="username">İstifadəçi adı</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus value="{{ username|default:'' }}" />
    <label for="password">Şifrə</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Daxil ol</button>
  </form>
</body>
</html>
