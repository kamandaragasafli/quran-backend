<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title|default:"Gizlilik siyasəti" }} · Miras Akademiyası</title>
  <meta name="description" content="{{ lead|default:'' }}" />
  <style>
    :root {
      --bg: #f3ede3;
      --card: #fff;
      --text: #1c2a3a;
      --muted: #6b7c8f;
      --accent: #2bbbad;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 12px 40px rgba(28, 42, 58, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 500;
    }
    .body h2 {
      margin: 28px 0 10px;
      font-size: 18px;
      color: var(--text);
    }
    .body h3 {
      margin: 20px 0 8px;
      font-size: 15px;
    }
    .body p { margin: 0 0 14px; }
    .body blockquote {
      margin: 0 0 14px;
      padding: 12px 16px;
      border-left: 4px solid var(--accent);
      background: rgba(43, 187, 173, 0.08);
      color: var(--text);
      border-radius: 0 12px 12px 0;
    }
    .foot {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <article class="card">
      <h1>{{ title }}</h1>
      {% if lead %}<p class="lead">{{ lead }}</p>{% endif %}
      <div class="body">{{ body_html|safe }}</div>
      <p class="foot">Miras Akademiyası · Gizlilik siyasəti</p>
    </article>
  </div>
</body>
</html>
