<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Miras{% endblock %} · Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #E4EAF3;
      --bg-soft: #F3F6FB;
      --card: #FFFFFF;
      --text: #1C2A3A;
      --muted: #6B7C8F;
      --teal: #2BBBAD;
      --teal-deep: #1F9A8F;
      --green: #3ECF8E;
      --blue: #5B9DFF;
      --amber: #E8A84A;
      --purple: #7C5CF0;
      --cyan: #4A9BC7;
      --border: rgba(28, 42, 58, 0.08);
      --shadow: rgba(40, 70, 120, 0.12);
      --sidebar-w: 280px;
      --radius: 22px;
      --g-home: linear-gradient(135deg, #3ECF8E 0%, #2BBBAD 48%, #5B9DFF 100%);
      --g-summaries: linear-gradient(135deg, #8EC5FF, #5B9DFF);
      --g-quran: linear-gradient(135deg, #7ED6C2, #2BBBAD);
      --g-telegram: linear-gradient(135deg, #7EC8E3, #4A9BC7);
      --g-reciters: linear-gradient(135deg, #A78BFA, #7C5CF0);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 100% -10%, rgba(91, 157, 255, 0.18), transparent 55%),
        radial-gradient(900px 500px at -10% 100%, rgba(43, 187, 173, 0.14), transparent 50%),
        var(--bg);
      color: var(--text);
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      padding: 26px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: sticky;
      top: 0;
      height: 100vh;
      box-shadow: 8px 0 32px rgba(40, 70, 120, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px 10px;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--g-home);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 20px;
      box-shadow: 0 10px 24px rgba(43, 187, 173, 0.4);
      flex-shrink: 0;
      position: relative;
    }
    .brand-mark::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--g-home);
      opacity: 0.25;
      z-index: -1;
      filter: blur(6px);
    }
    .brand-text strong {
      display: block;
      font-size: 22px;
      letter-spacing: -0.03em;
      font-weight: 800;
    }
    .brand-text span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      background: var(--bg-soft);
      border: 1px solid transparent;
      box-shadow: 0 4px 14px rgba(40, 70, 120, 0.06);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    }
    .nav a:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(40, 70, 120, 0.12);
      text-decoration: none;
      border-color: rgba(91, 157, 255, 0.2);
    }
    .nav-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(28, 42, 58, 0.06);
      color: var(--muted);
      font-size: 15px;
      flex-shrink: 0;
      transition: background .15s, color .15s;
    }

    /* Active: full Miras gradient cards */
    .nav a.active {
      color: #fff !important;
      border-color: transparent;
      box-shadow: 0 12px 28px rgba(40, 70, 120, 0.22);
      transform: translateY(-1px);
    }
    .nav a.active .nav-icon {
      background: rgba(255, 255, 255, 0.28);
      color: #fff;
    }
    .nav a.nav-home.active { background: var(--g-home); }
    .nav a.nav-summaries.active { background: var(--g-summaries); }
    .nav a.nav-quran.active { background: var(--g-quran); }
    .nav a.nav-telegram.active { background: var(--g-telegram); }
    .nav a.nav-reciters.active { background: var(--g-reciters); }

    /* Idle accent strip on icon */
    .nav a.nav-home:not(.active) .nav-icon { background: rgba(62, 207, 142, 0.16); color: #2BA56E; }
    .nav a.nav-summaries:not(.active) .nav-icon { background: rgba(91, 157, 255, 0.16); color: #3A7AD9; }
    .nav a.nav-quran:not(.active) .nav-icon { background: rgba(43, 187, 173, 0.16); color: #1F9A8F; }
    .nav a.nav-telegram:not(.active) .nav-icon { background: rgba(74, 155, 199, 0.16); color: #2F7FA8; }
    .nav a.nav-reciters:not(.active) .nav-icon { background: rgba(124, 92, 240, 0.14); color: #6A4FD8; }

    .sidebar-foot {
      padding: 14px 12px 6px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      font-weight: 600;
    }
    .sidebar-foot a {
      color: var(--teal-deep);
      font-weight: 700;
      background: rgba(43, 187, 173, 0.1);
      padding: 2px 8px;
      border-radius: 999px;
    }

    .main {
      padding: 28px 34px 56px;
      min-width: 0;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }
    .page-title {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .page-sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--border);
      box-shadow: 0 6px 18px var(--shadow);
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(62, 207, 142, 0.28);
      animation: pulse 2s ease infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px 16px;
      box-shadow: 0 10px 28px var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .stat::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--g-home);
      border-radius: 4px 0 0 4px;
    }
    .stat .n {
      font-size: 30px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
    }
    .stat .l {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    .panel {
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: 0 10px 28px var(--shadow);
      margin-bottom: 18px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      font-weight: 800;
    }
    .empty {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      padding: 8px 0 4px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    @media (min-width: 900px) {
      .feature-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    .feature-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 148px;
      padding: 18px;
      border-radius: var(--radius);
      color: #fff;
      text-decoration: none;
      box-shadow: 0 14px 32px rgba(40, 70, 120, 0.18);
      transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
    }
    .feature-card:hover {
      transform: translateY(-3px) scale(1.01);
      filter: brightness(1.04);
      box-shadow: 0 18px 40px rgba(40, 70, 120, 0.24);
      text-decoration: none;
      color: #fff;
    }
    .feature-card.wide {
      grid-column: 1 / -1;
      min-height: 118px;
      flex-direction: row;
      align-items: center;
      gap: 16px;
    }
    .feature-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: rgba(255,255,255,0.28);
      display: grid;
      place-items: center;
      font-size: 22px;
      backdrop-filter: blur(4px);
    }
    .feature-card h3 {
      margin: 16px 0 0;
      font-size: 18px;
      font-weight: 800;
    }
    .feature-card.wide h3 { margin: 0; }
    .feature-card p {
      margin: 6px 0 0;
      font-size: 13px;
      opacity: 0.92;
      font-weight: 500;
    }
    .g-last { background: var(--g-home); }
    .g-meal { background: var(--g-summaries); }
    .g-quran { background: var(--g-quran); }
    .g-hifz { background: linear-gradient(135deg, #F6C77A, #E8A84A); }
    .g-reciters { background: var(--g-reciters); }
    .g-groups { background: var(--g-telegram); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 800;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(91, 157, 255, 0.16);
      color: #3A7AD9;
    }
    .badge.off {
      background: rgba(107, 124, 143, 0.14);
      color: var(--muted);
    }
    .muted { color: var(--muted); }
    .msg-text {
      max-width: 420px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table-wrap table { min-width: 480px; }

    .menu-toggle {
      display: none;
      appearance: none;
      border: 1px solid var(--border);
      background: var(--card);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      margin-bottom: 10px;
      align-items: center;
      gap: 8px;
    }

    .backdrop {
      display: none;
    }

    /* —— Tablet —— */
    @media (max-width: 1100px) {
      :root { --sidebar-w: 250px; }
      .main { padding: 24px 22px 48px; }
      .feature-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* —— Mobile / drawer —— */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(88vw, 300px);
        max-width: 300px;
        z-index: 50;
        transform: translateX(-105%);
        transition: transform .22s ease;
        box-shadow: 16px 0 40px rgba(15, 20, 27, 0.2);
        height: 100dvh;
        overflow-y: auto;
      }
      .sidebar.open { transform: translateX(0); }
      .backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(28, 42, 58, 0.45);
        z-index: 45;
        backdrop-filter: blur(3px);
        border: 0;
        padding: 0;
        margin: 0;
        cursor: pointer;
      }
      .backdrop.show { display: block; }
      body.nav-open { overflow: hidden; }

      .menu-toggle { display: inline-flex; }
      .main {
        padding: 16px 14px 40px;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }
      .topbar {
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 18px;
      }
      .topbar > div:first-child {
        flex: 1;
        min-width: 0;
      }
      .page-title {
        font-size: 22px;
        line-height: 1.2;
        word-break: break-word;
      }
      .page-sub { font-size: 13px; }
      .pill {
        font-size: 12px;
        padding: 7px 10px;
        flex-shrink: 0;
      }

      .feature-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .feature-card {
        min-height: 120px;
        padding: 14px;
        border-radius: 18px;
      }
      .feature-card.wide {
        min-height: auto;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
      }
      .feature-card h3 { font-size: 15px; margin-top: 12px; }
      .feature-card.wide h3 { margin: 0; font-size: 16px; }
      .feature-card.wide p { font-size: 12px; }
      .feature-icon { width: 42px; height: 42px; font-size: 18px; }

      .grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .stat { padding: 14px 16px; border-radius: 18px; }
      .stat .n { font-size: 26px; }

      .panel {
        padding: 16px;
        border-radius: 18px;
        margin-bottom: 14px;
      }

      .nav a { padding: 11px 12px; font-size: 13px; }
    }

    /* —— Small phones —— */
    @media (max-width: 480px) {
      .feature-grid { grid-template-columns: 1fr; }
      .feature-card.wide { flex-direction: row; align-items: center; }
      .pill { display: none; }
      .page-title { font-size: 20px; }
      .main { padding: 14px 12px 36px; }
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <button type="button" class="backdrop" id="backdrop" aria-label="Menyunu bağla"></button>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        
        <div class="brand-text">
          <strong>Miras</strong>
          <span>Dashboard</span>
        </div>
      </div>

      <nav class="nav">
        <a href="{% url 'dash-home' %}" class="nav-home {% if nav == 'home' %}active{% endif %}">
          <span class="nav-icon">⌂</span> Ana
        </a>
        <a href="{% url 'dash-summaries' %}" class="nav-summaries {% if nav == 'summaries' %}active{% endif %}">
          <span class="nav-icon">◈</span> Xülasələr
        </a>
        <a href="{% url 'dash-quran' %}" class="nav-quran {% if nav == 'quran' %}active{% endif %}">
          <span class="nav-icon">☪</span> Quran
        </a>
        <a href="{% url 'dash-reciters' %}" class="nav-reciters {% if nav == 'reciters' %}active{% endif %}">
          <span class="nav-icon">🎧</span> Qarilər haqqında
        </a>
      </nav>

      <div class="sidebar-foot">
        API: <a href="/api/health">/api/health</a>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <button type="button" class="menu-toggle" id="menuToggle" aria-label="Menyu" aria-expanded="false">☰ Menyu</button>
          <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
          <p class="page-sub">{% block page_sub %}{% endblock %}</p>
        </div>
        <div class="pill"><span class="dot"></span> {% now "d.m.Y H:i" %}</div>
      </div>

      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function () {
      var sidebar = document.getElementById('sidebar');
      var backdrop = document.getElementById('backdrop');
      var toggle = document.getElementById('menuToggle');
      function close() {
        sidebar.classList.remove('open');
        backdrop.classList.remove('show');
        document.body.classList.remove('nav-open');
        if (toggle) toggle.setAttribute('aria-expanded', 'false');
      }
      function open() {
        sidebar.classList.add('open');
        backdrop.classList.add('show');
        document.body.classList.add('nav-open');
        if (toggle) toggle.setAttribute('aria-expanded', 'true');
      }
      if (toggle) toggle.addEventListener('click', function () {
        if (sidebar.classList.contains('open')) close(); else open();
      });
      if (backdrop) backdrop.addEventListener('click', close);
      sidebar.querySelectorAll('.nav a').forEach(function (link) {
        link.addEventListener('click', close);
      });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    })();
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
