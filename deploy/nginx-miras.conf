# Miras / quran-backend — nginx nümunəsi (DigitalOcean və s.)
#
# Vacib: /static/ üçün boş alias QOYMAYIN — admin CSS 404 olur.
# Ya WhiteNoise (aşağıdakı kimi hamısı proxy), ya da collectstatic
# sonrası düzgün alias.
#
# Quraşdırma:
#   sudo cp deploy/nginx-miras.conf /etc/nginx/sites-available/miras
#   # root/path-ləri öz serverinə uyğun dəyiş
#   sudo ln -sf /etc/nginx/sites-available/miras /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream miras_gunicorn {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name 164.90.165.24;

    client_max_body_size 32m;

    # Hamısı Django + WhiteNoise (STATIC_URL=/sf/ və ya /static/)
    location / {
        proxy_pass http://miras_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # İstəsəniz nginx özü versin (collectstatic sonrası):
    # location /static/ {
    #     alias /var/www/Quran/quran-backend/staticfiles/;
    #     access_log off;
    #     expires 7d;
    # }
}
